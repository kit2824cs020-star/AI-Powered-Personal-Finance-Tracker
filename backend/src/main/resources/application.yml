server:
  port: ${PORT:8080}
spring:
  application:
    name: personal-finance-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/finance_tracker}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-key-change-this-to-at-least-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
